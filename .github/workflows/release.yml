name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # electron-builder sube artefactos al GitHub Release

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests del núcleo
        run: npm test

      - name: Build del frontend
        run: npm run build

      - name: Publicar NSIS en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always
